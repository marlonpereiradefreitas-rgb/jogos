name: Release (instalador Windows)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: quarentena-z
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: quarentena-z/package-lock.json
      - run: npm ci
      - run: npx electron-builder --win nsis portable --publish never
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            quarentena-z/dist/*Setup*.exe
            quarentena-z/dist/*.exe
          generate_release_notes: true