name: Testes
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quarentena-z
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check game.js && node --check server.js
      - run: node verificar_projeto.js
      - run: node tools/determinism-test.js game.js
      - run: node tools/test-upgrades.js game.js
      - run: node tools/test-save.js game.js
      - run: node tools/test-features.js game.js
      - run: node tools/test-achievements.js game.js
      - run: node tools/test-maps.js game.js
      - run: node tools/test-supplies.js game.js
      - run: node tools/test-end-screen.js game.js
      - run: node tools/test-backend.js